# Serves the built web app and forwards API calls to the backend container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads: 100 MB videos plus form overhead
    client_max_body_size 110m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Built files have hashed names: cache them hard
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: every other path loads index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
