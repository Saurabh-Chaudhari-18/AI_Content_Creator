# Serves the built web app and forwards API calls to the backend container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads: 100 MB videos plus form overhead
    client_max_body_size 110m;

    # Production adds real-ip.conf here (behind Caddy); none locally.
    include /etc/nginx/snippets/real-ip*.conf;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The real client address for rate limiting and audit rows.
        # OVERWRITE (never append to) whatever the client sent, so it can't
        # be spoofed; the API trusts it because TRUST_X_FORWARDED_FOR=true.
        # Behind another proxy (a load balancer), set_real_ip_from that
        # proxy instead, so $remote_addr is the visitor again.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Built files have hashed names: cache them hard
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Single-page app: every other path loads index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Don't announce the nginx version in headers and error pages.
    server_tokens off;
}
