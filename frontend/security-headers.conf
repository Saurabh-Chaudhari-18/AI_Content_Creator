# Security headers for the web app's own files (index.html and /assets).
# Included in each location below, because nginx drops server-level
# add_header lines in any location that sets its own (Cache-Control here).
# API responses get their own headers from the API (app/core/middleware.py).
# HSTS is added by the HTTPS proxy in production (deploy/Caddyfile), not
# here: this nginx also serves plain http://localhost.

# No other site may frame the app (stops clickjacking of Approve / Post now).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Scripts only from this site (no inline scripts, no eval).
# style-src needs 'unsafe-inline': the UI library sets inline styles for
# positioning popovers and toasts. That does not allow running code.
# img/media: photos come from this site (/static) or from https object
# storage (R2/S3); blob: and data: are upload previews.
# connect-src: this site's API, plus Sentry error reports when enabled.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
