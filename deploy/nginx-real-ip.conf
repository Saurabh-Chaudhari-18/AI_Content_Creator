# Production only (mounted by docker-compose.prod.yml): requests reach nginx
# through Caddy, so the visitor's address is in Caddy's X-Forwarded-For,
# not in $remote_addr. The web container publishes no port — only
# containers on the compose network (Caddy) can connect — so trusting the
# private Docker ranges means trusting Caddy.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
