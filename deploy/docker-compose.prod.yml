# OmniPost — production stack on one server (a VPS with Docker).
# The everyday developer stack is backend/docker-compose.yml; this one differs
# on purpose: HTTPS, production mode, no demo data, no open database ports,
# separate database logins, a Redis password and nightly backups.
#
# First time (see deploy/README.md for the whole checklist):
#     cp .env.example .env        # then fill in every value
#     docker compose -f docker-compose.prod.yml up -d --build
#     docker compose -f docker-compose.prod.yml exec api python -m app.cli grant-super-admin you@example.com
# Update after a code change:
#     git pull && docker compose -f docker-compose.prod.yml up -d --build

name: omnipost-prod

x-backend: &backend
  build: ../backend
  restart: unless-stopped
  environment: &backend-env
    ENVIRONMENT: production
    DEBUG: "false"
    COOKIE_SECURE: "true"
    # The app's own login: rows only (deploy/postgres-init/01-roles.sh)
    DATABASE_URL: postgresql+asyncpg://omnipost_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}@postgres:5432/ai_content
    ADMIN_DATABASE_URL: postgresql+asyncpg://omnipost_admin_app:${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD}@postgres:5432/ai_content
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
    FERNET_KEY: ${FERNET_KEY:?set FERNET_KEY}
    FRONTEND_URL: https://${DOMAIN:?set DOMAIN}
    ALLOWED_ORIGINS: '["https://${DOMAIN}"]'
    META_APP_ID: ${META_APP_ID:-}
    META_APP_SECRET: ${META_APP_SECRET:-}
    META_REDIRECT_URI: https://${DOMAIN}/api/v1/social/callback/facebook
    # Meta downloads photos by URL, so production needs object storage (R2/S3).
    STORAGE_BACKEND: s3
    S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
    S3_REGION: ${S3_REGION:-auto}
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    # Visitors arrive through Caddy then nginx; nginx passes the real address.
    TRUST_X_FORWARDED_FOR: "true"
    TRUSTED_PROXY_COUNT: "1"
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # TLS certificates: keep this volume
      - caddy_config:/config
    depends_on: [web]
    logging: *logging

  web:
    build:
      context: ../frontend
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    restart: unless-stopped
    volumes:
      - ./nginx-real-ip.conf:/etc/nginx/snippets/real-ip.conf:ro
    # No ports: only Caddy reaches it.
    depends_on: [api]
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ai_content
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:?set OWNER_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD}
    command: >
      postgres
      -c max_connections=100
      -c log_min_duration_statement=1000
      -c idle_in_transaction_session_timeout=600000
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # No ports: the database is reachable only from the containers below.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_content"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  # One-off on every start: apply new migrations as the owner login. No demo
  # data. The first super admin is made by hand (see the header).
  migrate:
    <<: *backend
    restart: "no"
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+asyncpg://omnipost_owner:${OWNER_DB_PASSWORD}@postgres:5432/ai_content
    command: alembic upgrade head
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  api:
    <<: *backend
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: ${API_WORKERS:-3}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-server-header
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-2}
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Exactly ONE beat: two would dispatch every due job twice as often.
  beat:
    <<: *backend
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Nightly database dump into ./backups (custom format, for pg_restore).
  # A copy on the same server is NOT a backup on its own: sync ./backups
  # off the server too (deploy/README.md, "Backups").
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ai_content
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/usr/local/bin/omnipost-backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/omnipost-backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
