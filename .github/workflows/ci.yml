# Runs on every pull request and every push to main. A red check means the
# change must not be merged until it is fixed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, tests, dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      # Integration tests drop and recreate their own *_test database here.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_content_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt ruff==0.14.0 pip-audit
      - name: Lint (ruff)
        run: ruff check app tests seeds
      - name: Tests (unit + integration against real Postgres and Redis)
        run: pytest -q -p no:cacheprovider
      - name: Known vulnerabilities in Python dependencies
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend (types, lint, build, dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npx tsc -b
      - name: Lint
        run: npx eslint .
      - name: Build
        run: npx vite build
      # Only what ships to browsers; build tools (vite and friends) are checked by Dependabot-style review.
      - name: Known vulnerabilities in shipped dependencies
        run: npm audit --omit=dev --audit-level=high

  compose:
    name: Docker Compose files are valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Developer stack
        working-directory: backend
        run: touch .env && docker compose config --quiet
      - name: Production stack
        working-directory: deploy
        run: |
          sed -e 's/^\([A-Z0-9_]*\)=$/\1=ci-placeholder/' .env.example > .env
          docker compose -f docker-compose.prod.yml config --quiet
