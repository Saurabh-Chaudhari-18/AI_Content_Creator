# OmniPost — Docker services. Docker Desktop shows them as one project: "omnipost".
#
# Whole project, one command (only Docker needed) — from this backend folder:
#     docker compose up -d --build
#     → builds the images, updates the database and adds demo data, then starts the
#       API, worker, scheduler and web app.  Web app: http://localhost:4173
# Or double-click start-docker.cmd in the repository root (Windows), or run
# scripts/docker-up.ps1 / scripts/docker-up.sh — they also create backend/.env.
# After the first start, the play / stop button on "omnipost" in Docker Desktop
# starts and stops everything (it does not rebuild after code changes; use --build).
#
# Developer mode (you run the API, worker and web app yourself, see scripts/start.*):
#     docker compose up -d postgres redis
#
# backend/.env must exist (scripts/setup.* or scripts/docker-up.* create it).
#
# A port already taken on your machine? Override it, e.g. WEB_PORT=4174 or POSTGRES_PORT=5433
# (if you change POSTGRES_PORT or REDIS_PORT for local development, update backend/.env to match).

name: omnipost

x-backend: &backend
  build: .
  env_file: .env
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_content
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://minio:9000
    FRONTEND_URL: http://localhost:${WEB_PORT:-4173}
    META_REDIRECT_URI: http://localhost:8000/api/v1/social/callback/facebook
  volumes:
    - uploads:/code/uploads

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_content
    ports:
      # Local machine only: the database is never reachable from your network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes   # scheduled jobs survive restarts
    ports:
      # Local machine only: Redis has no password and holds the task queue.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional S3-compatible storage for real photo publishing (see docs/07_setup_guide.md §12)
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  # ── The app: API, worker, scheduler, web (all start with `docker compose up`) ──

  # One-off: create/upgrade tables, then add demo data (safe to repeat)
  migrate:
    <<: *backend
    environment:
      <<: *backend-env
      # Demo logins (incl. a super admin) whose password is in seeds/seed.py.
      # Fine on your own machine; run with SEED_DEMO=0 anywhere others can reach.
      SEED_DEMO: ${SEED_DEMO:-1}
    command: sh -c 'alembic upgrade head && if [ "$$SEED_DEMO" = "1" ]; then python -m seeds.seed; else echo "Demo data skipped (SEED_DEMO=$$SEED_DEMO)"; fi'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      <<: *backend-env
      # Requests arrive through the web container's nginx, which overwrites
      # X-Forwarded-For with the real client address (frontend/nginx.conf).
      # Without this every user shares nginx's address: one person's failed
      # logins would lock everyone out.
      TRUST_X_FORWARDED_FOR: "true"
      TRUSTED_PROXY_COUNT: "1"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      # Local machine only. Other devices (a phone on your Wi-Fi) use the web
      # app on WEB_PORT, whose nginx forwards /api here with the real client IP.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      migrate:
        condition: service_completed_successfully

  # REQUIRED for scheduled publishing — Beat dispatches due jobs every minute.
  beat:
    <<: *backend
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ../frontend
    ports:
      - "${WEB_PORT:-4173}:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  miniodata:
  uploads:
