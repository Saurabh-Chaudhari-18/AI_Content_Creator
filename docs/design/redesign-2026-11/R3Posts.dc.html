<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>All Posts &amp; Drafts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
.th{--bg:#120D0A;--side:#17110D;--sunk:#1A130F;--panel:#1D1511;--panel2:#221913;--panel3:#2A1F18;--line:#2C2119;--bd1:#33261D;--bd2:#3A2B21;--bd3:#4A3727;--bd4:#5A4433;--tx:#F4EADF;--tx2:#D9CBBB;--mut:#BFAE9B;--sub:#9C8A77;--ac:#EE8F35;--ac-tx:#F5A65B;--ac-lab:#F0A04F;--ac-pill:#F5B371;--ac-hi:#FBC48C;--ac-soft:#F5C89A;--g1:#F6A24A;--g2:#E2802A;--rim:#B8601E;--on-ac:#1F1208;--inv-bg:#F4EADF;--ok:#8BD3A0;--ok-tx:#A8E0B8;--bad:#F3A08F;--bad2:#DC5A3C;--bad-dk:#9E3E2A;--bad-tx:#F3C3B8;--info:#B5C9EE;--info2:#9DB8E8;--on-inv:#1F1208}
.th[data-theme="obsidian"]{--bg:#0B0F17;--side:#111722;--sunk:#0E131D;--panel:#151D2A;--panel2:#1B2536;--panel3:#212E44;--line:#1C2537;--bd1:#232E42;--bd2:#27334A;--bd3:#2B3850;--bd4:#3A4864;--tx:#E8ECF4;--tx2:#C3CBDA;--mut:#A3AEC2;--sub:#8B97AD;--ac:#6366F1;--ac-tx:#A5B4FC;--ac-lab:#818CF8;--ac-pill:#C7D2FE;--ac-hi:#E0E7FF;--ac-soft:#C7D2FE;--g1:#6366F1;--g2:#4F46E5;--rim:#3730A3;--on-ac:#FFFFFF;--inv-bg:#E8ECF4;--ok:#34D399;--ok-tx:#6EE7B7;--bad:#F87171;--bad2:#E5484D;--bad-dk:#9B2C2F;--bad-tx:#FCA5A5;--info:#93C5FD;--info2:#60A5FA;--on-inv:#0B0F17}
.th[data-theme="daylight"]{--bg:#F5F7FA;--side:#FFFFFF;--sunk:#EEF1F6;--panel:#FFFFFF;--panel2:#F6F8FB;--panel3:#EEF1F6;--line:#E9EDF3;--bd1:#E3E7EE;--bd2:#DCE1EA;--bd3:#D5DBE5;--bd4:#B8C1CF;--tx:#111827;--tx2:#374151;--mut:#4B5565;--sub:#6B7280;--ac:#4F46E5;--ac-tx:#4338CA;--ac-lab:#4F46E5;--ac-pill:#3730A3;--ac-hi:#312E81;--ac-soft:#3730A3;--g1:#5B54EA;--g2:#4338CA;--rim:#4F46E5;--on-ac:#FFFFFF;--inv-bg:#111827;--ok:#059669;--ok-tx:#047857;--bad:#DC2626;--bad2:#DC2626;--bad-dk:#991B1B;--bad-tx:#991B1B;--info:#1D4ED8;--info2:#3B82F6;--on-inv:#FFFFFF}
.th[data-theme="amethyst"]{--bg:#110C1A;--side:#150F21;--sunk:#181125;--panel:#1C1429;--panel2:#231933;--panel3:#2C2040;--line:#2A1F3A;--bd1:#31253F;--bd2:#392B4A;--bd3:#4A3860;--bd4:#5C4878;--tx:#F3EEFA;--tx2:#D6CCE6;--mut:#B6A9CB;--sub:#8E7FA6;--ac:#D9A93E;--ac-tx:#E8C46A;--ac-lab:#E2B550;--ac-pill:#EBCB7E;--ac-hi:#F3D995;--ac-soft:#E9D29A;--g1:#EDC66A;--g2:#C9962E;--rim:#8A6418;--on-ac:#1E1405;--inv-bg:#F3EEFA;--ok:#8BD3A0;--ok-tx:#A8E0B8;--bad:#F3A0A8;--bad2:#D9506A;--bad-dk:#8E2A44;--bad-tx:#F6C2CC;--info:#BFC8F2;--info2:#A0AEEA;--on-inv:#1E1405}
.th[data-theme="sapphire"]{--bg:#0A0F1E;--side:#0D1427;--sunk:#0F172C;--panel:#121B32;--panel2:#17223D;--panel3:#1D2A4A;--line:#1C2843;--bd1:#22304F;--bd2:#293A5E;--bd3:#364B76;--bd4:#465E8E;--tx:#EEF3FC;--tx2:#CAD5EC;--mut:#A6B4D2;--sub:#7C8CB0;--ac:#6FA3FF;--ac-tx:#8DB6FF;--ac-lab:#7FAEFF;--ac-pill:#A3C4FF;--ac-hi:#C2D8FF;--ac-soft:#B8CFFF;--g1:#9CC3FF;--g2:#5E95F2;--rim:#2F5FC4;--on-ac:#08132E;--inv-bg:#EEF3FC;--ok:#7FD8A8;--ok-tx:#A3E6C1;--bad:#F5A3A3;--bad2:#E05A5A;--bad-dk:#9A2F3A;--bad-tx:#F8C6C6;--info:#C9B8F5;--info2:#B09AF0;--on-inv:#08132E}
.th[data-theme="emerald"]{--bg:#08130F;--side:#0B1813;--sunk:#0D1B16;--panel:#10201A;--panel2:#152821;--panel3:#1B3229;--line:#1A2B24;--bd1:#20352C;--bd2:#273F35;--bd3:#335244;--bd4:#426654;--tx:#EEF6F1;--tx2:#CBDDD3;--mut:#A6BFB2;--sub:#7C978A;--ac:#D8B970;--ac-tx:#E3C987;--ac-lab:#DDBF77;--ac-pill:#E8D39C;--ac-hi:#F0E0B5;--ac-soft:#E6D5A6;--g1:#ECD493;--g2:#C8A552;--rim:#8A6E2A;--on-ac:#1A1405;--inv-bg:#EEF6F1;--ok:#8FD9B0;--ok-tx:#AEE6C6;--bad:#F3A08F;--bad2:#D9553C;--bad-dk:#9A3A28;--bad-tx:#F6C4B8;--info:#B7CAF0;--info2:#98B2EA;--on-inv:#1A1405}
.th[data-theme="burgundy"]{--bg:#14080C;--side:#1A0B10;--sunk:#1D0D13;--panel:#221016;--panel2:#2A151C;--panel3:#331A23;--line:#2E1820;--bd1:#381E28;--bd2:#422431;--bd3:#573042;--bd4:#6C3E54;--tx:#F8EDEF;--tx2:#E2CDD2;--mut:#C6A9B1;--sub:#9C7F88;--ac:#E8A07E;--ac-tx:#F0B497;--ac-lab:#EBA585;--ac-pill:#F3C0A6;--ac-hi:#F8D3BF;--ac-soft:#F2C9B4;--g1:#F2B595;--g2:#D3845F;--rim:#8E4A30;--on-ac:#24100A;--inv-bg:#F8EDEF;--ok:#8BD3A0;--ok-tx:#A8E0B8;--bad:#FF9FA8;--bad2:#E0405A;--bad-dk:#9C2338;--bad-tx:#FFC7CD;--info:#B9C6F0;--info2:#9DAEEA;--on-inv:#24100A}
.th[data-theme="ivory"]{--bg:#F6F1E7;--side:#EFE7D8;--sunk:#F3ECDF;--panel:#FFFDF8;--panel2:#FAF5EA;--panel3:#F1E8D6;--line:#E4D9C4;--bd1:#E0D3BB;--bd2:#D6C7AB;--bd3:#C2AF8C;--bd4:#A8936C;--tx:#1B2340;--tx2:#33405F;--mut:#4E5B78;--sub:#6D7891;--ac:#1F3A8A;--ac-tx:#1F3A8A;--ac-lab:#7A5A12;--ac-pill:#7A5A12;--ac-hi:#12286A;--ac-soft:#7A5A12;--g1:#2B4DAA;--g2:#1A3079;--rim:#B8902F;--on-ac:#FFFBF2;--inv-bg:#1B2340;--ok:#2E8B57;--ok-tx:#1F6B42;--bad:#C2412D;--bad2:#D9553C;--bad-dk:#9E3E2A;--bad-tx:#8E2A1C;--info:#2F5DB8;--info2:#3D6BC4;--on-inv:#FFFBF2}
body{margin:0;background:var(--bg)}
*{box-sizing:border-box}
a{color:var(--ac-tx)}a:hover{color:var(--ac-hi)}
button{font:inherit;cursor:pointer}
input{font:inherit}
input::placeholder{color:var(--sub)}
</style>
</helmet>
<div class="th" data-theme="{{theme}}" style="width: 100%; min-height: 1000px; display: flex; flex-wrap: wrap; align-items: stretch; background: var(--bg); color: var(--tx); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5">

<div style="flex: 1 1 264px; max-width: 100%; background: var(--side); border-right: 1px solid var(--line)">
<dc-import name="R3Sidebar" active="posts" hint-size="100%,1000px"></dc-import>
</div>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 22px 40px; border-bottom: 1px solid var(--line)">
<h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-size: 34px">All Posts <span style="color: var(--ac-lab); font-style: italic">&amp; Drafts</span></h1>
<span style="flex: 1"></span>
<span style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--bd3); background: var(--panel); font-size: 14px; font-weight: 500"><span style="width: 9px; height: 9px; border-radius: 5px; background: var(--ok)"></span>Auto-publish is on</span>
<a href="R3Compose.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 22px; border-radius: 12px; background: linear-gradient(180deg, var(--g1) 0%, var(--g2) 100%); color: var(--on-ac); text-decoration: none; font-weight: 700; box-shadow: 0 10px 28px color-mix(in srgb, var(--ac) 28%, transparent)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>New post</a>
</header>

<div style="display: flex; flex-direction: column; gap: 20px; padding: 32px 40px 48px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<div style="flex: 1 1 320px; max-width: 460px; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--bd4); background: var(--panel); color: var(--mut)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<label for="ps-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search posts</label>
<input id="ps-q" type="search" placeholder="Search by title, caption or hashtag" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--tx); font-size: 15px">
</div>
<span style="flex: 1"></span>
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ac-lab)">Brand</span>
<button type="button" aria-pressed="true" style="height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--ac-lab) 70%, transparent); background: color-mix(in srgb, var(--ac) 14%, transparent); color: var(--ac-hi); font-weight: 600; font-size: 14px">All brands</button>
<button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--bd3); background: var(--panel); color: var(--tx2); font-weight: 500; font-size: 14px"><span style="width: 8px; height: 8px; border-radius: 4px; background: var(--ac)"></span>FitZone Gym</button>
<button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--bd3); background: var(--panel); color: var(--tx2); font-weight: 500; font-size: 14px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #C9A27A"></span>Aura Coffee</button>
</div>

<div role="tablist" aria-label="Filter by status" style="display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
<button type="button" role="tab" aria-selected="{{t.sel}}" style="display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px; border: 0; border-bottom: 2px solid {{t.line}}; background: transparent; color: {{t.fg}}; font-weight: 600; font-size: 15px">{{t.label}}<span style="min-width: 24px; height: 22px; padding: 0 7px; border-radius: 11px; border: 1px solid var(--bd3); color: var(--tx2); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{t.count}}</span></button>
</sc-for>
</div>

<section aria-label="Posts" style="border-radius: 20px; border: 1px solid var(--bd1); background: var(--panel); overflow-x: auto">
<div style="min-width: 900px; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: 2.4fr 1.3fr 1.4fr 1.1fr 120px; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ac-lab)">
<span>Post</span><span>Goes to</span><span>When</span><span>Status</span><span></span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div style="display: grid; grid-template-columns: 2.4fr 1.3fr 1.4fr 1.1fr 120px; gap: 12px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line)">
<span style="display: flex; align-items: center; gap: 14px; min-width: 0">
<span role="img" aria-label="Post photo" style="width: 52px; height: 52px; flex: none; border-radius: 10px; border: 1px solid var(--bd3); background: {{r.bg}}"></span>
<span style="display: flex; flex-direction: column; line-height: 1.35; min-width: 0"><span style="font-weight: 700; font-size: 15px">{{r.title}}</span><span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mut)"><span style="width: 7px; height: 7px; border-radius: 4px; background: {{r.dot}}"></span>{{r.brand}} · by {{r.author}}</span></span>
</span>
<span style="font-size: 14px; color: var(--tx2)">{{r.channels}}</span>
<span style="font-size: 14px; color: var(--tx2)">{{r.when}}</span>
<span><span style="height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid {{r.sb}}; color: {{r.sfg}}; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; white-space: nowrap">{{r.status}}</span></span>
<span style="text-align: right"><a href="{{r.href}}" style="display: inline-flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--bd3); color: var(--ac-tx); text-decoration: none; font-weight: 700; font-size: 14px; white-space: nowrap">{{r.action}}</a></span>
</div>
</sc-for>
</div>
</section>
<p style="margin: 0; font-size: 13px; color: var(--mut)">Showing 8 of 14 · Times in India time (IST)</p>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["espresso","obsidian","daylight","amethyst","sapphire","emerald","burgundy","ivory"],"default":"espresso"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const FZ = 'var(--ac)', AC = '#C9A27A';
    const S = {
      wait: { status: 'Waiting for you', sb: 'color-mix(in srgb, var(--ac-lab) 60%, transparent)', sfg: 'var(--ac-pill)', action: 'Review', href: 'R3Review.dc.html' },
      sched: { status: 'Scheduled', sb: 'color-mix(in srgb, var(--info2) 50%, transparent)', sfg: 'var(--info)', action: 'Open', href: 'R3Calendar.dc.html' },
      draft: { status: 'Draft', sb: 'var(--bd4)', sfg: 'var(--tx2)', action: 'Continue', href: 'R3Compose.dc.html' },
      fix: { status: 'Needs a fix', sb: 'color-mix(in srgb, var(--bad) 60%, transparent)', sfg: 'var(--bad)', action: 'Fix it', href: 'R3Accounts.dc.html' },
      posted: { status: 'Posted', sb: 'color-mix(in srgb, var(--ok) 50%, transparent)', sfg: 'var(--ok-tx)', action: 'View', href: 'R3Posts.dc.html' }
    };
    const g = (a, b, c) => 'linear-gradient(170deg, ' + a + ' 0%, ' + b + ' 50%, ' + c + ' 100%)';
    const rows = [
      { title: 'Community drop-in', brand: 'FitZone Gym', dot: FZ, author: 'Priya S.', channels: 'Facebook', when: 'Sun 22 Nov, 10:30 AM', bg: g('#D9B68C', '#7A4B2A', '#24140B'), ...S.fix },
      { title: 'Weekend sunrise yoga', brand: 'FitZone Gym', dot: FZ, author: 'Priya S.', channels: 'Instagram, Facebook', when: 'Sat 28 Nov, 7:00 AM', bg: g('#F7C873', '#E07A2A', '#5A2A12'), ...S.wait },
      { title: 'Member celebration gift box', brand: 'FitZone Gym', dot: FZ, author: 'Priya S.', channels: 'Instagram', when: 'Thu 26 Nov, 5:30 PM', bg: g('#E8B98A', '#9C5A2E', '#2E1A10'), ...S.wait },
      { title: 'Weekend pastry box', brand: 'Aura Coffee', dot: AC, author: 'Arjun K.', channels: 'Instagram', when: 'Today, 4:00 PM', bg: g('#F2C9A0', '#B8643A', '#3A1C10'), ...S.sched },
      { title: 'Winter blend launch', brand: 'Aura Coffee', dot: AC, author: 'Arjun K.', channels: 'Instagram, Facebook', when: 'Tue 24 Nov, 8:00 AM', bg: g('#E3C79F', '#8A5A34', '#2A190E'), ...S.sched },
      { title: 'Festive menu teaser', brand: 'Aura Coffee', dot: AC, author: 'Arjun K.', channels: 'Not chosen yet', when: 'No date yet', bg: g('#D8B48E', '#7E5634', '#261609'), ...S.draft },
      { title: 'Class of the week: HIIT', brand: 'FitZone Gym', dot: FZ, author: 'You', channels: 'Instagram', when: 'No date yet', bg: g('#BFA58A', '#5E4636', '#1A120D'), ...S.draft },
      { title: 'Saturday bootcamp', brand: 'FitZone Gym', dot: FZ, author: 'Priya S.', channels: 'Instagram, Facebook', when: 'Today, 7:00 AM', bg: g('#C7B29A', '#6E5440', '#1E150F'), ...S.posted }
    ];
    const tabs = [
      ['All', 14, true], ['Waiting for you', 2], ['Scheduled', 6], ['Drafts', 4], ['Needs a fix', 1], ['Posted', 18]
    ].map(([label, count, sel]) => ({ label, count, sel: sel ? 'true' : 'false', line: sel ? 'var(--ac)' : 'transparent', fg: sel ? 'var(--tx)' : 'var(--mut)' }));
    return { theme: this.props.theme ?? 'espresso', rows, tabs };
  }
}
</script>
</body>
</html>
